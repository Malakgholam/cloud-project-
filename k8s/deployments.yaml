apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: support-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: amiraashraf/auth-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: auth-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: MONGO_URI
---
