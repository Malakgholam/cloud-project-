apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: supportdesk-prod
  labels:
    app: reporting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
        - name: reporting-service
          image: supportdesk/reporting-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3004"
            - name: TICKET_SERVICE_URL
              value: "http://ticket-service:3001"
            - name: LOG_LEVEL
              value: "error"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: supportdesk-prod
  labels:
    app: reporting-service
spec:
  type: ClusterIP
  ports:
    - port: 3004
      targetPort: 3004
  selector:
    app: reporting-service