apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-service
  namespace: supportdesk-prod
  labels:
    app: support-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support-service
  template:
    metadata:
      labels:
        app: support-service
    spec:
      containers:
        - name: support-service
          image: supportdesk/support-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: support-uri
            - name: TICKET_SERVICE_URL
              value: "http://ticket-service:3001"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3003"
            - name: LOG_LEVEL
              value: "error"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: support-service
  namespace: supportdesk-prod
  labels:
    app: support-service
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
  selector:
    app: support-service