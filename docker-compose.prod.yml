services:
  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: supportdesk-ticket-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb+srv://amira:amira123@cluster0.avavr8w.mongodb.net/ticketsDB_prod?appName=Cluster0&retryWrites=true&w=majority
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOG_LEVEL=error
    networks:
      - supportdesk-network-prod
    restart: always

  support-service:
    build:
      context: ./support-service
      dockerfile: Dockerfile
    container_name: supportdesk-support-prod
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGO_URI=mongodb+srv://amira:amira123@cluster0.avavr8w.mongodb.net/supportDB_prod?appName=Cluster0&retryWrites=true&w=majority
      - TICKET_SERVICE_URL=http://ticket-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOG_LEVEL=error
    depends_on:
      - ticket-service
    networks:
      - supportdesk-network-prod
    restart: always

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: supportdesk-notification-prod
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGO_URI=mongodb+srv://amira:amira123@cluster0.avavr8w.mongodb.net/notificationsDB_prod?appName=Cluster0&retryWrites=true&w=majority
      - LOG_LEVEL=error
    networks:
      - supportdesk-network-prod
    restart: always

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: supportdesk-reporting-prod
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - TICKET_SERVICE_URL=http://ticket-service:3001
      - LOG_LEVEL=error
    depends_on:
      - ticket-service
    networks:
      - supportdesk-network-prod
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TICKET_SERVICE_URL=http://localhost:3001
        - VITE_SUPPORT_SERVICE_URL=http://localhost:3002
        - VITE_REPORT_SERVICE_URL=http://localhost:3004
    container_name: supportdesk-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - ticket-service
      - support-service
      - reporting-service
    networks:
      - supportdesk-network-prod
    restart: always

networks:
  supportdesk-network-prod:
    driver: bridge