services:
  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: supportdesk-ticket-test
    ports:
      - "4001:3001"
    environment:
      - NODE_ENV=testing
      - PORT=3001
      - MONGO_URI=mongodb+srv://amira:amira123@cluster0.avavr8w.mongodb.net/ticketsDB_test?appName=Cluster0&retryWrites=true&w=majority
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOG_LEVEL=warn
    networks:
      - supportdesk-network-test

  support-service:
    build:
      context: ./support-service
      dockerfile: Dockerfile
    container_name: supportdesk-support-test
    ports:
      - "4002:3002"
    environment:
      - NODE_ENV=testing
      - PORT=3002
      - MONGO_URI=mongodb+srv://amira:amira123@cluster0.avavr8w.mongodb.net/supportDB_test?appName=Cluster0&retryWrites=true&w=majority
      - TICKET_SERVICE_URL=http://ticket-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOG_LEVEL=warn
    depends_on:
      - ticket-service
    networks:
      - supportdesk-network-test

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: supportdesk-notification-test
    ports:
      - "4003:3003"
    environment:
      - NODE_ENV=testing
      - PORT=3003
      - MONGO_URI=mongodb+srv://amira:amira123@cluster0.avavr8w.mongodb.net/notificationsDB_test?appName=Cluster0&retryWrites=true&w=majority
      - LOG_LEVEL=warn
    networks:
      - supportdesk-network-test

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: supportdesk-reporting-test
    ports:
      - "4004:3004"
    environment:
      - NODE_ENV=testing
      - PORT=3004
      - TICKET_SERVICE_URL=http://ticket-service:3001
      - LOG_LEVEL=warn
    depends_on:
      - ticket-service
    networks:
      - supportdesk-network-test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportdesk-frontend-test
    ports:
      - "4000:80"
    depends_on:
      - ticket-service
      - support-service
      - reporting-service
    networks:
      - supportdesk-network-test

networks:
  supportdesk-network-test:
    driver: bridge