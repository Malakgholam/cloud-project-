version: '3.8'

services:
  # ========== MongoDB ==========
  mongodb:
    image: mongo:7
    container_name: supportdesk-mongodb-test
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db
    networks:
      - supportdesk-network-test

  # ========== Ticket Service ==========
  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: supportdesk-ticket-test
    ports:
      - "4001:3001"
    environment:
      - NODE_ENV=testing
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/tickets_test
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOG_LEVEL=warn
    depends_on:
      - mongodb
    networks:
      - supportdesk-network-test

  # ========== Support Service ==========
  support-service:
    build:
      context: ./support-service
      dockerfile: Dockerfile
    container_name: supportdesk-support-test
    ports:
      - "4002:3002"
    environment:
      - NODE_ENV=testing
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/support_test
      - TICKET_SERVICE_URL=http://ticket-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOG_LEVEL=warn
    depends_on:
      - mongodb
      - ticket-service
    networks:
      - supportdesk-network-test

  # ========== Notification Service ==========
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: supportdesk-notification-test
    ports:
      - "4003:3003"
    environment:
      - NODE_ENV=testing
      - PORT=3003
      - MONGO_URI=mongodb://mongodb:27017/notifications_test
      - LOG_LEVEL=warn
    depends_on:
      - mongodb
    networks:
      - supportdesk-network-test

  # ========== Reporting Service ==========
  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: supportdesk-reporting-test
    ports:
      - "4004:3004"
    environment:
      - NODE_ENV=testing
      - PORT=3004
      - TICKET_SERVICE_URL=http://ticket-service:3001
      - LOG_LEVEL=warn
    depends_on:
      - ticket-service
    networks:
      - supportdesk-network-test

  # ========== Frontend ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TICKET_SERVICE_URL=http://localhost:4001
        - VITE_SUPPORT_SERVICE_URL=http://localhost:4002
        - VITE_REPORT_SERVICE_URL=http://localhost:4004
    container_name: supportdesk-frontend-test
    ports:
      - "4000:80"
    depends_on:
      - ticket-service
      - support-service
      - reporting-service
    networks:
      - supportdesk-network-test

networks:
  supportdesk-network-test:
    driver: bridge
